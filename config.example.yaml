# influencer-analytics 配置样例。复制为 config.yaml 后按需修改。
# 首次使用只需填写 product 段和选择一个 preset，其余可用默认值。

market: cn                    # cn=国内(小红书/抖音) | intl=海外(v0.1未实现)
preset: claude-skill          # presets/ 下的预设文件名（不含 .yaml）

product:                      # 也可由预设提供；此处填写会覆盖预设
  brand_name: ""              # 例: Waybox
  repo_url: ""                # 例: github.com/Waybox-AI/roadtrip-skill
  pitch_one_liner: ""         # 一句话卖点，进话术 {{product_pitch}}
  kpi: []                     # 例: [github_stars, site_uv]

screening:                    # 硬性门槛（第 2 节）
  followers_min: 1000
  followers_max: 10000
  over_cap_tolerance: 0.15    # 略超上限的容忍比例
  median_floor: 30
  fan_ratio_floor: 0.01       # 中位互动 ÷ 粉丝 的及格线
  posts_30d_min: 4
  search_boosted_ratio: 0.5   # 中位≥粉丝×此值 → 标记搜索流型账号

estimation:                   # 曝光/报价系数（第 8 节，均可被校准结果替换）
  xhs_read_multiplier: 33
  xhs_save_like_ratio_default: 1.29
  douyin_play_per_like: 26.5
  commercial_discount: 0.7
  platform_fee_rate: 0.10     # 蒲公英/星图报备费，用于 budget_planned

pacing:                       # 风控红线（第 6 节）
  min_interval_seconds: 45
  batch_break_every: 8
  batch_break_minutes: 3
  daily_profile_cap: 60
  daily_dm_cap: 20

calibration:                  # 校准分级门槛（第 5 节）
  min_samples_for_output: 8
  min_samples_per_tier: 3
  min_samples_for_regression: 20

cpm_reference:                # 样本不足时显示的行业参考区间（元/千次）
  xiaohongshu_image: [80, 200]
  xiaohongshu_video: [30, 100]
  douyin_video: [30, 100]
